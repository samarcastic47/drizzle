# Keeps both Drizzle contracts ticking without a machine that stays on.
# Each run lasts ~58 minutes, then re-dispatches itself (GitHub's cron is a backup:
# it often doesn't fire on new repos). Anyone can also tick from the UI.
name: keeper

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: keeper
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    strategy:
      fail-fast: false
      matrix:
        include:
          - contract: drizzle-replay.testnet
            interval: 10
          - contract: drizzle-live.testnet
            interval: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build keeper
        working-directory: keeper
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Run keeper for ~58 minutes
        working-directory: keeper
        env:
          NEAR_ACCOUNT_ID: ${{ secrets.NEAR_ACCOUNT_ID }}
          NEAR_PRIVATE_KEY: ${{ secrets.NEAR_PRIVATE_KEY }}
        run: |
          # timeout exits 124 when time is up; that is the normal end of a run.
          timeout --signal=INT 3480 node dist/keeper.js --contract ${{ matrix.contract }} --interval ${{ matrix.interval }} --min-gap 60 || { c=$?; [ "$c" -eq 124 ] || [ "$c" -eq 130 ]; }

  rearm:
    needs: tick
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run keeper -R ${{ github.repository }} --ref main
