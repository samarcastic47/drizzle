[package]
name="prefetch"
version="0.1.0"
edition="2021"
rust-version="1.85"
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
near-sdk={version="5",features=["unit-testing"]}
near-contract-standards="5"
uint={version="0.9",default-features=false}
serde_json="1"
[dev-dependencies]
near-workspaces={version="0.20",features=["unstable"]}
tokio={version="1",features=["full"]}
anyhow="1"
