[package]
name = "drizzle"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Drizzle ($DRIZZLE): a NEP-141 memecoin that mints only when it rains in 12 cities"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.24.0", features = ["legacy"] }
near-contract-standards = "=5.24.0"
uint = { version = "0.9", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.24.0", features = ["legacy", "unit-testing"] }
near-workspaces = { version = "=0.20.1", features = ["unstable"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
